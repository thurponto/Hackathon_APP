<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Provas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        h2 {
            font-weight: bold;
            margin-bottom: 20px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .btn-warning, .btn-danger, .btn-info {
            margin-right: 5px;
        }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments :: header"></div>

<h2>Lista de Provas</h2>
<a class="btn btn-primary mb-3" th:href="@{/provas/novo}">Nova Prova</a>
<table class="table table-bordered table-striped">
    <thead class="table-light">
    <tr>
        <th>Título</th>
        <th>Data</th>
        <th>Turma</th>
        <th>Disciplina</th>
        <th>Alternativas Corretas</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${provas}">
        <td th:text="${p.titulo}">Título</td>
        <td th:text="${p.data != null ? #temporals.format(p.data, 'dd/MM/yyyy') : 'Sem data'}">Data</td>
        <td th:text="${p.turma != null ? p.turma.nome : 'Sem turma'}">Turma</td>
        <td th:text="${p.disciplina != null ? p.disciplina.nome : 'Sem disciplina'}">Disciplina</td>
        <td th:text="${p.alternativasCorretas}">Alternativas</td>
        <td>
            <a class="btn btn-sm btn-warning" th:href="@{/provas/editar/{id}(id=${p.id})}">Editar</a>
            <form th:action="@{/provas/excluir/{id}(id=${p.id})}" method="post" style="display:inline">
                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Confirma exclusão?')">Excluir</button>
            </form>
            <a class="btn btn-sm btn-info" th:href="@{/provas/{id}/notas(id=${p.id})}">Notas</a>
        </td>
    </tr>
    </tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

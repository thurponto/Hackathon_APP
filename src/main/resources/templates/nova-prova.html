<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Criar Nova Prova</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h2>Criar Nova Prova</h2>
<form method="post" th:action="@{/provas/criar}">
    <div class="mb-3">
        <label>Disciplina</label>
        <input type="text" name="disciplina" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Turma</label>
        <input type="text" name="turma" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Data</label>
        <input type="date" name="data" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Gabarito (separado por vírgulas)</label>
        <input type="text" name="gabarito" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
</form>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de Aluno</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        h2 {
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments :: header"></div>

<h2 th:text="${aluno.id == null} ? 'Novo Aluno' : 'Editar Aluno'"></h2>
<form th:action="@{/alunos}" th:object="${aluno}" method="post">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" th:field="*{nome}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" th:field="*{email}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Turma</label>
        <select class="form-select" th:field="*{turma.id}" required>
            <option value="" disabled selected>Selecione uma turma</option>
            <option th:each="turma : ${turmas}"
                    th:value="${turma.id}"
                    th:text="${turma.nome}">
            </option>
        </select>
    </div>
    <button type="submit" class="btn btn-success">Salvar</button>
    <a th:href="@{/alunos}" class="btn btn-secondary">Cancelar</a>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

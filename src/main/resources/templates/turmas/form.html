<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de Turma</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        h2 {
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments :: header"></div>

<h2 th:text="${turma.id == null} ? 'Nova Turma' : 'Editar Turma'"></h2>
<form th:action="@{/turmas}" th:object="${turma}" method="post">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
        <label class="form-label">Nome da Turma</label>
        <input type="text" class="form-control" th:field="*{nome}" required>
    </div>
    <button type="submit" class="btn btn-success">Salvar</button>
    <a th:href="@{/turmas}" class="btn btn-secondary">Cancelar</a>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

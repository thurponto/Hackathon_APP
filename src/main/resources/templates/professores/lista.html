<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Professores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        h2 {
            font-weight: bold;
            margin-bottom: 20px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .btn-warning, .btn-danger {
            margin-right: 5px;
        }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments :: header"></div>

<h2>Lista de Professores</h2>
<a class="btn btn-primary mb-3" th:href="@{/professores/novo}">Novo Professor</a>
<table class="table table-bordered table-striped">
    <thead class="table-light">
    <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="prof : ${professores}">
        <td th:text="${prof.nome}">Nome</td>
        <td th:text="${prof.email}">Email</td>
        <td>
            <a class="btn btn-sm btn-warning" th:href="@{/professores/editar/{id}(id=${prof.id})}">Editar</a>
            <form th:action="@{/professores/excluir/{id}(id=${prof.id})}" method="post" style="display:inline">
                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Confirma exclusão?')">Excluir</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

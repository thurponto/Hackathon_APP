<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Turmas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        h2 {
            font-weight: bold;
            margin-bottom: 20px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .btn-warning, .btn-danger {
            margin-right: 5px;
        }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments :: header"></div>

<h2>Lista de Turmas</h2>
<a class="btn btn-primary mb-3" th:href="@{/turmas/novo}">Nova Turma</a>
<table class="table table-bordered table-striped">
    <thead class="table-light">
    <tr>
        <th>Nome</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="turma : ${turmas}">
        <td th:text="${turma.nome}">Nome</td>
        <td>
            <a class="btn btn-sm btn-warning" th:href="@{/turmas/editar/{id}(id=${turma.id})}">Editar</a>
            <a class="btn btn-sm btn-danger" th:href="@{/turmas/excluir/{id}(id=${turma.id})}">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Dashboard - Gabarito</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .header {
      background-color: #007bff;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .card-title {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .card-text {
      font-size: 1.1rem;
    }
    .footer {
      text-align: center;
      padding: 10px;
      background-color: #007bff;
      color: white;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
<div th:replace="fragments :: header" class="header"></div>

<div class="container mt-4">
  <h1 class="text-center mb-4">Bem-vindo ao Dashboard do Gabarito</h1>
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Gerenciamento de Provas</h5>
      <p class="card-text">Aqui você pode gerenciar suas provas, corrigir avaliações, administrar professores, turmas, disciplinas e alunos.</p>

    </div>
  </div>
</div>

<div class="footer">
  <p>&copy; 2023 Gabarito. Todos os direitos reservados.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

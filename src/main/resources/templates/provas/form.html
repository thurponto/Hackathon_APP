<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nova Prova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8f9fa;
        }
        h1 {
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments :: header"></div>

<h1>Cadastrar Prova</h1>
<form th:action="@{/provas}" th:object="${prova}" method="post">

    <div class="mb-3">
        <label for="titulo" class="form-label">Título</label>
        <input type="text" th:field="*{titulo}" id="titulo" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label for="data" class="form-label">Data</label>
        <input type="date" th:field="*{data}" id="data" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label for="turma" class="form-label">Turma</label>
        <select th:field="*{turma.id}" id="turma" class="form-select" required>
            <option value="" disabled selected>Selecione uma turma</option>
            <option th:each="turma : ${turmas}" th:value="${turma.id}" th:text="${turma.nome}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label for="disciplina" class="form-label">Disciplina</label>
        <select th:field="*{disciplina.id}" id="disciplina" class="form-select" required>
            <option value="" disabled selected>Selecione uma disciplina</option>
            <option th:each="disciplina : ${disciplinas}" th:value="${disciplina.id}" th:text="${disciplina.nome}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label for="alternativasCorretas" class="form-label">Alternativas corretas (separadas por ponto e vírgula)</label>
        <input type="text" th:field="*{alternativasCorretas}" id="alternativasCorretas" class="form-control" placeholder="Exemplo: A;B;C;D;A" />
    </div>

    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="/provas" class="btn btn-secondary">Cancelar</a>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

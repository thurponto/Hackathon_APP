<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Disciplina</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        h2 {
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments :: header"></div>

<h2 th:text="${disciplina.id == null} ? 'Nova Disciplina' : 'Editar Disciplina'"></h2>
<form th:action="@{/disciplinas}" th:object="${disciplina}" method="post">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" th:field="*{nome}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Professor</label>
        <select class="form-select" th:field="*{professor.id}" required>
            <option value="" disabled selected>Selecione um professor</option>
            <option th:each="professor : ${professores}"
                    th:value="${professor.id}"
                    th:text="${professor.nome}">
            </option>
        </select>
    </div>
    <button type="submit" class="btn btn-success">Salvar</button>
    <a th:href="@{/disciplinas}" class="btn btn-secondary">Cancelar</a>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

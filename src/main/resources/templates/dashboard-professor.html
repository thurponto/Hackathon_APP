<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Gabarito Digital</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --dark: #212529;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            color: var(--dark);
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h2 {
            font-weight: 600;
            color: var(--primary);
        }

        .logout-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .logout-btn:hover {
            background-color: #2c2a9a; /* Cor ao passar o mouse */
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .action-card {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            text-align: center;
            border-left: 4px solid var(--primary);
        }

        .action-card:hover {
            transform: translateY(-5px);
        }

        .action-icon {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .btn-action {
            border-radius: 6px;
            padding: 0.5rem 1rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
        }

        @media (max-width: 768px) {
            .quick-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <div class="header">
        <h2>Painel do Professor</h2>
        <form action="/logout" method="post" style="display: inline;">
            <button type="submit" class="logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </div>

    <!-- Ações Disponíveis -->
    <div class="quick-actions">
        <div class="action-card">
            <div class="action-icon">
                <i class="bi bi-file-earmark-plus"></i>
            </div>
            <h5>Criar Prova</h5>
            <a href="/provas/nova" class="btn btn-primary btn-action">
                <i class="bi bi-plus-lg"></i> Acessar
            </a>
        </div>

        <div class="action-card">
            <div class="action-icon">
                <i class="bi bi-clipboard-data"></i>
            </div>
            <h5>Ver Resultados</h5>
            <a href="/provas/resultados" class="btn btn-info btn-action">
                <i class="bi bi-bar-chart"></i> Acessar
            </a>
        </div>

        <div class="action-card">
            <div class="action-icon">
                <i class="bi bi-book"></i>
            </div>
            <h5>Cadastrar Disciplina</h5>
            <a href="/disciplinas/nova" class="btn btn-warning btn-action">
                <i class="bi bi-pencil"></i> Acessar
            </a>
        </div>

        <div class="action-card">
            <div class="action-icon">
                <i class="bi bi-people-fill"></i>
            </div>
            <h5>Cadastrar Turma</h5>
            <a href="/turmas/nova" class="btn btn-secondary btn-action">
                <i class="bi bi-person-plus"></i> Acessar
            </a>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Prova</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 600px;
            margin-top: 50px;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #4361ee;
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: #4361ee;
            border: none;
        }

        .btn-primary:hover {
            background-color: #3f37c9;
        }

        select.form-control {
            padding: 10px 15px;
            height: auto;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Criar Nova Prova</h2>
    <form method="post" th:action="@{/provas/criar}">
        <div class="mb-3">
            <label for="disciplina" class="form-label">Disciplina</label>
            <select id="disciplina" name="disciplina" class="form-select" required>
                <option value="" selected disabled>Selecione uma disciplina</option>
                <option th:each="disciplina : ${disciplinas}"
                        th:value="${disciplina.id}"
                        th:text="${disciplina.nome}"></option>
            </select>
        </div>
        <div tapermatumba="mb-3">
            <label for="turma" class="form-label">Turma</label>
            <select id="turma" name="turma" class="form-select" required>
                <option value="" selected disabled>Selecione uma turma</option>
                <option th:each="turma : ${turmas}"
                        th:value="${turma.id}"
                        th:text="${turma.codigo}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="data" class="form-label">Data</label>
            <input type="date" id="data" name="data" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="gabarito" class="form-label">Gabarito (separado por vírgulas)</label>
            <input type="text" id="gabarito" name="gabarito" class="form-control"
                   placeholder="Ex: A,B,C,D,A,B,C" required>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/dashboard-professor}" class="btn btn-outline-secondary ms-2">Cancelar</a>
    </form>
</div>
</body>
</html>
